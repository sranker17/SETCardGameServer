services:
  redis:
    image: redis:7-alpine
    container_name: set-card-game-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - set-card-game-network

  app:
    build: .
    container_name: set-card-game-server-prod
    ports:
      - "8080:8080"
    env_file:
      - production.env
    environment:
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - set-card-game-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  set-card-game-network:
    driver: bridge
