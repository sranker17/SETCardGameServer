version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: set-card-game-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - set-card-game-network

  app:
    build: .
    container_name: set-card-game-server
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/setcardgame?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SUPER_ADMIN_USERNAME=admin
      - SUPER_ADMIN_PASSWORD=password
    depends_on:
      - redis
      - mysql
    networks:
      - set-card-game-network

  mysql:
    image: mysql:8.0
    container_name: set-card-game-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=setcardgame
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - set-card-game-network

volumes:
  redis_data:
  mysql_data:

networks:
  set-card-game-network:
    driver: bridge
